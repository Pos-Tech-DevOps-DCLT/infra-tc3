name: CI/CD Go TC3

on:
  workflow_call:
    inputs:
      project:
        description: 'Nome da imagem do projeto dentro do ECR'
        required: true
        type: string

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1 — Build e Testes Unitários (paralelo ao lint)
  # ══════════════════════════════════════════════════════════════
  build-and-test:
    name: "🔍 1 · Testes Unitários"
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Baixar dependências
        run: go mod download

      - name: Instalar go-junit-report e gocyclo
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Executar testes com cobertura
        run: |
          go test ./... -v -coverprofile=coverage.out -covermode=atomic 2>&1 | tee test-output.txt
          go tool cover -func=coverage.out | tee coverage-func.txt
          cat test-output.txt | go-junit-report -set-exit-code > test-results.xml || true

      - name: Publicar cobertura no Job Summary
        if: always()
        run: |
          echo "## 📈 Cobertura de Código" >> $GITHUB_STEP_SUMMARY
          echo "| Função | Cobertura |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -q "total:"; then
              PCT=$(echo "$line" | awk '{print $NF}')
              echo "| **Total** | **$PCT** |" >> $GITHUB_STEP_SUMMARY
            else
              FUNC=$(echo "$line" | awk '{print $2}')
              PCT=$(echo "$line" | awk '{print $NF}')
              echo "| \`$FUNC\` | $PCT |" >> $GITHUB_STEP_SUMMARY
            fi
          done < coverage-func.txt || true

      - name: Publicar resultados dos testes
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml

      - name: Complexidade ciclomática (gocyclo)
        if: always()
        run: |
          echo "## 🔬 Complexidade Ciclomática" >> $GITHUB_STEP_SUMMARY
          gocyclo -over 1 . | sort -rn | head -10 > cyclo-top.txt || true
          if [ ! -s cyclo-top.txt ]; then
            echo "✅ Todas as funções com complexidade baixa." >> $GITHUB_STEP_SUMMARY
          else
            echo "| Função | Score | Localização |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|-------------|" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              SCORE=$(echo "$line" | cut -d' ' -f1)
              FUNC=$(echo "$line" | cut -d' ' -f3)
              LOC=$(echo "$line" | cut -d' ' -f4)
              if [ "$SCORE" -ge 10 ] 2>/dev/null; then ICON="🔴"
              elif [ "$SCORE" -ge 5 ] 2>/dev/null; then ICON="🟡"
              else ICON="🟢"; fi
              echo "| \`$FUNC\` | $ICON $SCORE | \`$LOC\` |" >> $GITHUB_STEP_SUMMARY
            done < cyclo-top.txt
          fi
          gocyclo -over 5 . || true

      - name: Publicar artefatos de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.project }}-test-reports
          path: |
            test-results.xml
            coverage.out
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — Lint / Análise Estática (paralelo ao build-and-test)
  # ══════════════════════════════════════════════════════════════
  lint:
    name: "🔍 2 · Lint / Análise Estática"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Instalar golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.57.2

      - name: Executar golangci-lint e publicar no Job Summary
        run: |
          JSON=$(golangci-lint run ./... --out-format json 2>/dev/null) || true
          COUNT=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('Issues') or []))" 2>/dev/null)
          COUNT=${COUNT:-0}

          echo "## 🔍 Lint — golangci-lint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$COUNT" -eq 0 ]; then
            echo "### ✅ 0 problemas encontrados" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ $COUNT problema(s) encontrado(s) — não bloqueia a pipeline" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Linter | Ocorrências |" >> $GITHUB_STEP_SUMMARY
            echo "|:---|---:|" >> $GITHUB_STEP_SUMMARY
            echo "$JSON" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          counts = {}
          for i in d.get('Issues') or []:
              l = i.get('FromLinter', 'desconhecido')
              counts[l] = counts.get(l, 0) + 1
          for linter, n in sorted(counts.items(), key=lambda x: -x[1]):
              print(f'| \`{linter}\` | {n} |')
          " >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>📄 Ver ocorrências detalhadas</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$JSON" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for i in d.get('Issues') or []:
              pos = i.get('Pos', {})
              print(f\"{pos.get('Filename')}:{pos.get('Line')}:{pos.get('Column')}: {i.get('Text')} ({i.get('FromLinter')})\")
          " >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          echo "$JSON"

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — Scan de Vulnerabilidades com Trivy - SCA
  # ══════════════════════════════════════════════════════════════
  trivy-scan:
    name: "🔍 3 · SCA (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy — scan e publicar no Job Summary
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — salvar relatório JSON
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-sca-results.json'

      - name: Publicar resumo no Job Summary
        if: always()
        run: |
          echo "## 🛡️ SCA — Trivy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f trivy-sca-results.json ]; then
            echo "⚠️ Relatório não encontrado — verificação pulada." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          COUNTS=$(python3 -c "
          import json
          with open('trivy-sca-results.json') as f:
              data = json.load(f)
          sev = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0, 'UNKNOWN': 0}
          for result in data.get('Results') or []:
              for v in result.get('Vulnerabilities') or []:
                  s = v.get('Severity', 'UNKNOWN')
                  sev[s] = sev.get(s, 0) + 1
          print(sum(sev.values()))
          for k in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN']:
              print(sev[k])
          ")
          TOTAL=$(echo "$COUNTS" | sed -n '1p')
          CRITICAL_COUNT=$(echo "$COUNTS" | sed -n '2p')
          HIGH_COUNT=$(echo "$COUNTS" | sed -n '3p')
          MEDIUM_COUNT=$(echo "$COUNTS" | sed -n '4p')
          LOW_COUNT=$(echo "$COUNTS" | sed -n '5p')
          UNKNOWN_COUNT=$(echo "$COUNTS" | sed -n '6p')

          echo "### 📊 Total: $TOTAL vulnerabilidade(s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severidade | Ocorrências |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | $HIGH_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | $MEDIUM_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW | $LOW_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ UNKNOWN | $UNKNOWN_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details><summary>📄 Ver CRITICAL / HIGH detalhados</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severidade | Pacote | Instalada | Corrigida | CVE |" >> $GITHUB_STEP_SUMMARY
          echo "|:---:|:---|:---|:---|:---|" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          with open('trivy-sca-results.json') as f:
              data = json.load(f)
          icon = {'CRITICAL': '🔴', 'HIGH': '🟠'}
          for result in data.get('Results') or []:
              for v in result.get('Vulnerabilities') or []:
                  s = v.get('Severity', 'UNKNOWN')
                  if s in icon:
                      fixed = v.get('FixedVersion') or '—'
                      print(f\"| {icon[s]} {s} | \`{v.get('PkgName')}\` | {v.get('InstalledVersion')} | {fixed} | {v.get('VulnerabilityID')} |\")
          " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Publicar relatório do Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.project }}-trivy-report
          path: trivy-sca-results.json
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 4 — Scan de Vulnerabilidades com Horusec - SAST
  # ══════════════════════════════════════════════════════════════
  horusec:
    name: "🔍 4 · SAST (Horusec)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Horusec
        uses: fike/horusec-action@v0.2.2
        continue-on-error: true
        with:
          arguments: >
            -p ./
            -o json
            -O horusec-results.json
            --ignore-severity LOW
            -i "**/README.md"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horusec-report
          path: horusec-results.json
          retention-days: 30

      - name: Bloquear em vulnerabilidade Crítica
        if: always()
        run: |
          echo "## 🔍 SAST — Horusec" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f horusec-results.json ]; then
            echo "⚠️ Relatório não encontrado — verificação pulada." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TOTAL=$(grep -oE '"severity"[[:space:]]*:[[:space:]]*"[A-Z]+"' horusec-results.json | wc -l)
          CRITICAL_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"CRITICAL"' horusec-results.json | wc -l)
          HIGH_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"HIGH"' horusec-results.json | wc -l)
          MEDIUM_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"MEDIUM"' horusec-results.json | wc -l)
          LOW_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"LOW"' horusec-results.json | wc -l)
          INFO_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"INFO"' horusec-results.json | wc -l)

          echo "### 📊 Total: $TOTAL vulnerabilidade(s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severidade | Ocorrências |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | $HIGH_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | $MEDIUM_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW | $LOW_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ INFO | $INFO_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL_COUNT" -gt 10 ]; then
            echo "❌ **Pipeline bloqueada** — $CRITICAL_COUNT vulnerabilidade(s) CRITICAL encontrada(s)." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Nenhuma vulnerabilidade CRITICAL encontrada." >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — Docker Build (aguarda jobs 1 a 4)
  # ══════════════════════════════════════════════════════════════
  docker-build:
    name: "5 · Docker Build"
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, trivy-scan, horusec]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ inputs.project }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/${{ inputs.project }}.tar

      - name: Publicar imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-docker-image
          path: /tmp/${{ inputs.project }}.tar
          retention-days: 1

  # ══════════════════════════════════════════════════════════════
  # JOB 6 — Push para AWS ECR (somente na branch main)
  # Requer secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  # ══════════════════════════════════════════════════════════════
  push-ecr:
    name: "6 · Push para AWS ECR"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Baixar imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.project }}-docker-image
          path: /tmp

      - run: docker load --input /tmp/${{ inputs.project }}.tar

      - name: Tag e push para ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-prod/${{ inputs.project }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)
          docker tag ${{ inputs.project }}:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          echo "✅ Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA" >> $GITHUB_STEP_SUMMARY
