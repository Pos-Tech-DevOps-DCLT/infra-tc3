# Secret do auth-service
# ATENÇÃO: substitua os valores pelos resultados reais do Terraform
#
# Como obter os valores:
#   terraform output -json connection_strings
#
# Como gerar base64 (PowerShell):
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu_valor"))
#
# Como gerar base64 (bash/Linux):
#   echo -n "seu_valor" | base64

apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: auth-service
  labels:
    app: auth-service
    version: "1.0"
type: Opaque
data:
  # Formato: postgres://dbadmin:<senha>@<rds-auth-endpoint>:5432/authdb
  # Obter senha: aws secretsmanager get-secret-value --secret-id tech-challenge-prod/rds/auth
  DATABASE_URL: cG9zdGdyZXM6Ly9kYmFkbWluOlY3dW5EJTJCSkI1JTVCJTI4bWFNMyUzQ0B0ZWNoLWNoYWxsZW5nZS1wcm9kLWF1dGguYzdjazZnZXNnZ2NrLnVzLWVhc3QtMS5yZHMuYW1hem9uYXdzLmNvbTo1NDMyL2F1dGhkYg==

  # Chave mestra para criar API keys — defina um valor forte
  # Exemplo: echo -n "minha-chave-mestra-segura" | base64
  MASTER_KEY: Y2hhbmdlbWUtbWFzdGVyLWtleQ==
