# Secret do evaluation-service
# ATENÇÃO: substitua os valores pelos resultados reais do Terraform
#
# Como obter o endpoint do Redis:
#   aws secretsmanager get-secret-value --secret-id tech-challenge-prod/elasticache/redis
#
# Formato da REDIS_URL (com TLS e auth token):
#   rediss://:<auth_token>@<primary_endpoint>:6379
#   Nota: "rediss://" com dois 's' = TLS habilitado
#
# Como gerar base64 (PowerShell):
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu_valor"))
#
# Como gerar base64 (bash):
#   echo -n "seu_valor" | base64

apiVersion: v1
kind: Secret
metadata:
  name: evaluation-service-secret
  namespace: evaluation-service
  labels:
    app: evaluation-service
    version: "1.0"
type: Opaque
data:
  # Formato: rediss://:<auth_token>@<elasticache-endpoint>:6379
  # auth_token obtido do Secrets Manager: tech-challenge-prod/elasticache/redis
  REDIS_URL: cmVkaXNzOi8vOmZPc3ZWYmNNWjFoc25raEg4cW1Xbk9TbWZDVWJtWUdDQG1hc3Rlci50ZWNoLWNoYWxsZW5nZS1wcm9kLXJlZGlzLmp3Ymdwdy51c2UxLmNhY2hlLmFtYXpvbmF3cy5jb206NjM3OQ==

  # Chave de API interna usada pelo evaluation-service para chamar flag/targeting services
  # Deve ser uma API key criada no auth-service via POST /admin/keys com MASTER_KEY
  SERVICE_API_KEY: Y2hhbmdlbWUtYXBpLWtleQ==
