# Secret do analytics-service
# As credenciais AWS são gerenciadas pelo IRSA — não são necessárias aqui
# Este arquivo existe para consistência e eventuais secrets futuros
apiVersion: v1
kind: Secret
metadata:
  name: analytics-service-secret
  namespace: analytics-service
  labels:
    app: analytics-service
    version: "1.0"
type: Opaque
data: {}
  # Não há secrets adicionais para o analytics-service.
  # AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY são providos automaticamente via IRSA.
