apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: analytics-service
  labels:
    app: analytics-service
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        version: "1.0"
    spec:
      # IRSA: usa o ServiceAccount com annotation da role IAM para acessar SQS e DynamoDB
      serviceAccountName: analytics-service
      containers:
        - name: analytics-service
          image: 142069230126.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-prod/analytics-service:latest
          ports:
            - containerPort: 8005
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          envFrom:
            - configMapRef:
                name: analytics-service-config
