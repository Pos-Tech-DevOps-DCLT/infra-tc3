# Namespaces para os 5 microsserviços do ToggleMaster
# Cada serviço tem seu próprio namespace isolado
# Isso é necessário para o IRSA funcionar com as roles corretas

apiVersion: v1
kind: Namespace
metadata:
  name: auth-service
  labels:
    app: auth-service
    project: togglemaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: flag-service
  labels:
    app: flag-service
    project: togglemaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: targeting-service
  labels:
    app: targeting-service
    project: togglemaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: evaluation-service
  labels:
    app: evaluation-service
    project: togglemaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics-service
  labels:
    app: analytics-service
    project: togglemaster
