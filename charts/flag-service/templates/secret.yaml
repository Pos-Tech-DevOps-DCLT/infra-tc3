# Secret do flag-service
# ATENÇÃO: substitua os valores pelos resultados reais do Terraform
#
# Como obter a senha do RDS:
#   aws secretsmanager get-secret-value --secret-id tech-challenge-prod/rds/flag
#
# Como gerar base64 (PowerShell):
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu_valor"))
#
# Como gerar base64 (bash):
#   echo -n "seu_valor" | base64

apiVersion: v1
kind: Secret
metadata:
  name: flag-service-secret
  namespace: flag-service
  labels:
    app: flag-service
    version: "1.0"
type: Opaque
data:
  # Formato: postgres://dbadmin:<senha>@<rds-flag-endpoint>:5432/flagdb
  DATABASE_URL: <BASE64_DATABASE_URL>
